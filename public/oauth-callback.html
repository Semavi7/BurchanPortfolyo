<!DOCTYPE html>
<html>
<head>
    <title>Notion Save Pro - Authenticating...</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #000000 0%, #434343 100%);
            color: white;
        }
        .container {
            text-align: center;
        }
        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>🔐 Giriş yapılıyor...</h2>
        <div class="spinner"></div>
        <p id="status">Notion Save Pro uygulamasına yönlendiriliyorsunuz</p>
    </div>
    
    <script>
        // URL'den authorization code'u al
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
        const error = urlParams.get('error');
        
        if (error) {
            document.getElementById('status').textContent = 'Hata: ' + error;
        } else if (code) {
            // Uygulamaya deep link ile geri dön
            const appUrl = 'notionsavepro://oauth?code=' + encodeURIComponent(code);
            window.location.href = appUrl;
            
            // 2 saniye sonra manuel link göster
            setTimeout(() => {
                document.getElementById('status').innerHTML = 
                    'Uygulama açılmadıysa <a href="' + appUrl + '" style="color: white;">buraya tıklayın</a>';
            }, 2000);
        } else {
            document.getElementById('status').textContent = 'Geçersiz callback';
        }
    </script>
</body>
</html>
